# The one required job for pull requests (standard ci-pr-gate, decision 0029). It calls the
# repo's own commands.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: task test
        run: nix develop -c task test
      - name: task memory
        run: nix develop -c task memory
      - name: task split
        run: nix develop -c task split
      - name: task secrets
        run: nix develop -c task secrets
