version: "3"

# Commands for running and checking this repo's outputs. Run inside the nix dev
# shell (direnv, or `nix develop`). Decision 0003.
#
# This repo has no outputs of its own yet. A project made from it adds its commands
# here (standard app-commands). Setting a project up is a playbook the agent
# follows from memory-kit/, not a task (decision 0020).

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: Test the kit's check scripts (baseline runner, kinds map, memory checks, PR split check)
    cmds:
      - memory-kit/checks/test-baseline.sh
      - memory-kit/checks/test-memory-check.sh
      - memory-kit/checks/test-pr-split.sh

  memory:
    desc: Check the repo's memory for drift (repo map, links, commands, size, indexes, decisions)
    set: [pipefail]
    cmds:
      - memory-kit/checks/memory-check.sh | memory-kit/checks/baseline.sh run memory

  split:
    desc: Fail a change that mixes code paths and memory paths (base is GATE_BASE, default origin/main)
    set: [pipefail]
    cmds:
      - memory-kit/checks/pr-split.sh | memory-kit/checks/baseline.sh run split

  secrets:
    desc: Scan the change's commits for secrets (base is GATE_BASE, default origin/main)
    cmds:
      - |
        base=${GATE_BASE:-origin/main}
        git rev-parse --verify -q "$base^{commit}" >/dev/null || { echo "secrets: base '$base' does not resolve (fetch it, or set GATE_BASE)" >&2; exit 2; }
        if [ "$(git rev-list --count "$base..HEAD")" = 0 ]; then
          echo "secrets: no commits in $base..HEAD, nothing was scanned" >&2
          [ -z "${CI:-}" ] || exit 1
          exit 0
        fi
        gitleaks git --log-opts="$base..HEAD" --redact --no-banner
